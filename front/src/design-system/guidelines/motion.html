<!-- @dsCard group="Spacing" viewport="700x120" name="Movimiento" subtitle="140 ms para controles, 220 ms para paneles; sin rebotes" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--surface-page);font-family:var(--font-body)}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.c{border:1px solid var(--border-subtle);border-radius:var(--radius-sm);background:var(--surface-card);padding:10px 12px}.l{font-size:12px;font-weight:600;color:var(--text-body)}.n{font-family:var(--font-mono);font-size:9px;color:var(--text-subtle);margin-top:4px}.t{height:4px;border-radius:2px;background:var(--pino-100);margin-top:8px;position:relative;overflow:hidden}.t i{position:absolute;inset:0;width:38%;background:var(--pino-500);border-radius:2px;animation:sl 1.8s var(--ease-standard) infinite}@keyframes sl{0%{left:0}50%{left:62%}100%{left:0}}</style></head><body>
<div class="g">
<div class="c"><div class="l">instant</div><div class="n">80ms · hover de fila</div><div class="t"><i></i></div></div>
<div class="c"><div class="l">fast</div><div class="n">140ms · controles</div><div class="t"><i style="animation-duration:2.1s"></i></div></div>
<div class="c"><div class="l">normal</div><div class="n">220ms · paneles, modales</div><div class="t"><i style="animation-duration:2.6s"></i></div></div>
<div class="c"><div class="l">ease-standard</div><div class="n">cubic-bezier(.2,0,.2,1)</div><div class="t"><i style="animation-timing-function:var(--ease-out)"></i></div></div>
</div></body></html>
