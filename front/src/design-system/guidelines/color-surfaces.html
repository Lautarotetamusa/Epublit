<!-- @dsCard group="Colors" viewport="700x150" name="Superficies y texto" subtitle="Pares de fondo/texto aprobados" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--surface-page);font-family:var(--font-body)}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.c{border-radius:var(--radius-md);padding:14px;min-height:84px;display:flex;flex-direction:column;justify-content:space-between}.n{font-size:10px;font-family:var(--font-mono);opacity:.7}</style></head><body>
<div class="g">
<div class="c" style="background:var(--surface-page);border:1px solid var(--border-subtle)"><b style="font-size:13px;color:var(--text-body)">Página</b><span class="n" style="color:var(--text-muted)">--surface-page</span></div>
<div class="c" style="background:var(--surface-card);border:1px solid var(--border-subtle);box-shadow:var(--shadow-sm)"><b style="font-size:13px;color:var(--text-body)">Tarjeta</b><span class="n" style="color:var(--text-muted)">--surface-card</span></div>
<div class="c" style="background:var(--surface-inverse)"><b style="font-size:13px;color:var(--text-inverse)">Inversa</b><span class="n" style="color:var(--pino-300)">--surface-inverse</span></div>
<div class="c" style="background:var(--surface-brand)"><b style="font-size:13px;color:var(--papel-0)">Marca</b><span class="n" style="color:var(--pino-200)">--surface-brand</span></div>
</div></body></html>
