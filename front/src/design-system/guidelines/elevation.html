<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--surface-page);font-family:var(--font-body)}.g{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.b{background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-md);height:62px}.n{font-family:var(--font-mono);font-size:9px;color:var(--text-subtle);display:block;margin-top:6px;text-align:center}</style></head><body>
<div class="g"><div><div class="b" style="box-shadow:var(--shadow-xs)"></div><span class="n">--shadow-xs</span></div><div><div class="b" style="box-shadow:var(--shadow-sm)"></div><span class="n">--shadow-sm</span></div><div><div class="b" style="box-shadow:var(--shadow-md)"></div><span class="n">--shadow-md</span></div><div><div class="b" style="box-shadow:var(--shadow-lg)"></div><span class="n">--shadow-lg</span></div><div><div class="b" style="box-shadow:var(--shadow-overlay)"></div><span class="n">--shadow-overlay</span></div></div></body></html>
