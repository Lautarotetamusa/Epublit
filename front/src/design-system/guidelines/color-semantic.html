<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--surface-page);font-family:var(--font-body)}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.c{border-radius:var(--radius-sm);padding:10px 12px;border:1px solid rgba(12,33,32,.08)}.k{font-size:10px;font-family:var(--font-mono);opacity:.75;margin-top:4px}</style></head><body>
<div class="g">
<div class="c" style="background:var(--exito-100);color:var(--exito-600)"><b style="font-size:12px">Liquidado</b><div class="k">--exito-600</div></div>
<div class="c" style="background:var(--aviso-100);color:var(--aviso-600)"><b style="font-size:12px">Pendiente</b><div class="k">--aviso-600</div></div>
<div class="c" style="background:var(--error-100);color:var(--error-600)"><b style="font-size:12px">Sin stock</b><div class="k">--error-600</div></div>
<div class="c" style="background:var(--info-100);color:var(--info-600)"><b style="font-size:12px">Informativo</b><div class="k">--info-600</div></div>
</div></body></html>
