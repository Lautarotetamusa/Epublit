<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:20px;background:var(--surface-page)}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { Table, Pagination, EmptyState, Card, Badge, Button, IconButton } = window.EpublitDesignSystem_2918d4;
const rows=[
{t:'La ciudad ausente',a:'Ricardo Piglia',isbn:'9789871234567',st:412,e:'ok'},
{t:'Cuentos del sur',a:'María Beltrán',isbn:'9789874455120',st:38,e:'bajo'},
{t:'Tratado del papel',a:'J. Ferreyra',isbn:'9789870099887',st:0,e:'sin'},
];
const cols=[
{header:'Título',key:'t',wrap:true},
{header:'Autor',key:'a',muted:true},
{header:'ISBN',key:'isbn',mono:true},
{header:'Stock',key:'st',align:'right',mono:true},
{header:'Estado',cell:r=>r.e==='ok'?<Badge tone="success" dot>En stock</Badge>:r.e==='bajo'?<Badge tone="warning">Stock bajo</Badge>:<Badge tone="error">Sin stock</Badge>},
{header:'',width:40,cell:()=><IconButton icon="ellipsis" label="Acciones" size="sm" />},
];
function Demo(){const [p,setP]=React.useState(1);return <div style={{display:'grid',gap:16}}>
<Card padded={false} title="Catálogo" subtitle="168 títulos" footer={<Pagination page={p} pageCount={7} total={168} onChange={setP} />}>
<Table columns={cols} rows={rows} onRowClick={()=>{}} />
</Card>
<Card padded={false}><EmptyState icon="receipt-text" title="Todavía no hay liquidaciones" description="Cuando registres ventas en consignación, las liquidaciones aparecen acá." action={<Button iconStart="plus">Nueva liquidación</Button>} /></Card>
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
