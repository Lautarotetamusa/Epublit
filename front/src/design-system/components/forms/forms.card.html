<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:20px;background:var(--surface-page)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px}.row{display:flex;gap:18px;flex-wrap:wrap;align-items:center}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { Field, Input, Textarea, Select, Checkbox, Radio, Switch } = window.EpublitDesignSystem_2918d4;
function Demo(){
const [c,setC]=React.useState(true),[s,setS]=React.useState(true),[r,setR]=React.useState('cons');
return <div>
<div className="grid">
<Field label="Título" required htmlFor="t"><Input id="t" defaultValue="La ciudad ausente" /></Field>
<Field label="ISBN" hint="13 dígitos, sin guiones" htmlFor="i"><Input id="i" iconStart="barcode" placeholder="9789871234567" /></Field>
<Field label="PVP" htmlFor="p"><Input id="p" suffix="ARS" defaultValue="18500" /></Field>
<Field label="Sello" htmlFor="se"><Select id="se" placeholder="Todos los sellos" options={['Sur Editora','Cuenco Azul','Prensa Menor']} /></Field>
<Field label="Ejemplares" error="Ingresá una cantidad mayor a cero" htmlFor="e"><Input id="e" invalid defaultValue="0" /></Field>
<Field label="Sinopsis" htmlFor="sn"><Textarea id="sn" rows={2} placeholder="Texto de contratapa" /></Field>
</div>
<div className="row" style={{marginTop:18}}>
<Checkbox label="Publicar en el ecommerce" checked={c} onChange={()=>setC(!c)} />
<Checkbox label="Indeterminado" indeterminate />
<Checkbox label="Deshabilitado" disabled />
<Switch label="Mostrar sin stock" checked={s} onChange={()=>setS(!s)} />
</div>
<div className="row" style={{marginTop:14,alignItems:'flex-start',gap:28}}>
<Radio name="m" label="Consignación" description="Se liquida sobre lo vendido" checked={r==='cons'} onChange={()=>setR('cons')} />
<Radio name="m" label="Venta en firme" description="Se factura al despachar" checked={r==='firme'} onChange={()=>setR('firme')} />
</div>
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
