<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Epublit — Sistema de gestión</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="./data.js"></script>
<style>html,body,#root{height:100%}body{margin:0;overflow:hidden}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="./LoginScreen.jsx"></script>
<script type="text/babel" src="./AppShell.jsx"></script>
<script type="text/babel" src="./DashboardScreen.jsx"></script>
<script type="text/babel" src="./CatalogScreen.jsx"></script>
<script type="text/babel" src="./BookScreen.jsx"></script>
<script type="text/babel" src="./SettlementsScreen.jsx"></script>
<script type="text/babel">
const { EmptyState, Button, Card } = window.EpublitDesignSystem_2918d4;

function App(){
  const [logged,setLogged] = React.useState(false);
  const [view,setView] = React.useState('inicio');
  const [libro,setLibro] = React.useState(null);
  const [toast,setToast] = React.useState(null);
  const notify = m => { setToast(m); if(m) setTimeout(()=>setToast(null),4000); };
  const openBook = l => { setLibro(l); setView('libros'); };

  if(!logged) return <LoginScreen onLogin={()=>setLogged(true)} />;

  let body;
  if(view==='inicio') body = <DashboardScreen onOpenBook={openBook} />;
  else if(view==='libros') body = libro
    ? <BookScreen libro={libro} onBack={()=>setLibro(null)} onToast={notify} />
    : <CatalogScreen onOpenBook={openBook} onToast={notify} />;
  else if(view==='liq') body = <SettlementsScreen onToast={notify} />;
  else body = <Card padded={false}><EmptyState icon="library" title="Pantalla no incluida en el kit"
      description="Este kit reproduce Inicio, Catálogo, Ficha del libro y Liquidaciones. El resto queda deliberadamente en blanco."
      action={<Button variant="secondary" onClick={()=>setView('inicio')}>Volver al inicio</Button>} /></Card>;

  return <AppShell view={view} onView={v=>{setLibro(null);setView(v);}} toast={toast} onToast={setToast}>{body}</AppShell>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
