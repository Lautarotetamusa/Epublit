<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Epublit — Gestión editorial</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../app/data.js"></script>
<style>body{margin:0}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="./SiteHeader.jsx"></script>
<script type="text/babel" src="./HomeSections.jsx"></script>
<script type="text/babel" src="./PricingSections.jsx"></script>
<script type="text/babel">
function Site(){
  const [page,setPage] = React.useState('producto');
  const [sent,setSent] = React.useState(false);
  const go = p => { setPage(p); window.scrollTo(0,0); };
  return <div>
    <SiteHeader page={page} onPage={go} />
    {page==='producto' ? <><Hero onPage={go} /><Features /><Ecommerce onPage={go} /><Pricing onPage={go} /></> : null}
    {page==='ecommerce' ? <Ecommerce onPage={go} /> : null}
    {page==='precios' ? <Pricing onPage={go} /> : null}
    {page==='ayuda' ? <Help /> : null}
    {page==='demo' ? <DemoForm sent={sent} onSent={()=>setSent(true)} /> : null}
    <SiteFooter />
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Site />);
</script></body></html>
