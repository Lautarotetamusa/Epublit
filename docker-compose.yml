# Los `$DB_USER`/`$DB_PASS`/`$DB_PORT`/`$PORT` de acá abajo los interpola
# `docker compose` (no el contenedor), y ese motor sólo lee un `.env` al lado
# de este archivo (raíz) — por eso hay un symlink `.env -> back/.env` en la
# raíz: una sola fuente de verdad para el env real del backend.
services:
  postgresdb:
    image: postgres:16
    restart: unless-stopped
    env_file: ./back/.env
    environment:
      - POSTGRES_USER=$DB_USER
      - POSTGRES_PASSWORD=$DB_PASS
      - POSTGRES_DB=$DB_NAME
    ports:
      - $DB_PORT:$DB_PORT
    volumes:
      - ./postgres:/var/lib/postgresql/data #Mantener la misma data de mi base de datos local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    depends_on:
      postgresdb:
        condition: service_healthy
    build:
      dockerfile: ./Dockerfile
      context: ./back
    restart: on-failure
    env_file: ./back/.env
    ports:
      - $PORT:$PORT
    environment:
      - DB_HOST=postgresdb
    command: node dist/src/index.js
    #command: npm run start:dev
    volumes:
     - ./back/files:/app/files
     - ./back/afipkeys:/app/afipkeys
     - ./back/src:/app/src
