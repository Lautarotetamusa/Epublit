services:
  postgresdb:
    image: postgres:16
    restart: unless-stopped
    env_file: ./.env
    environment:
      - POSTGRES_USER=$DB_USER
      - POSTGRES_PASSWORD=$DB_PASS
      - POSTGRES_DB=$DB_NAME
    ports:
      - $DB_PORT:$DB_PORT
    volumes:
      - ./postgres:/var/lib/postgresql/data #Mantener la misma data de mi base de datos local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    depends_on:
      postgresdb:
        condition: service_healthy
    build:
      dockerfile: ./Dockerfile
      context: .
    restart: on-failure
    env_file: ./.env
    ports:
      - $PORT:$PORT
    environment:
      - DB_HOST=postgresdb
    command: node dist/src/index.js
    #command: npm run start:dev
    volumes:
     - ./files:/app/files
     - ./afipkeys:/app/afipkeys
     - ./src:/app/src
