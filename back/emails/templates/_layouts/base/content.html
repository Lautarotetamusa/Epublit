<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title></title>
  <style>
    body { margin: 0; padding: 0; background: #F7F5F0; color: #1F2421; font-family: "Helvetica Neue", Arial, sans-serif; font-size: 16px; line-height: 1.55; }
    a { color: #22605D; }
    .contenedor { width: 100%; background: #F7F5F0; padding: 32px 16px; }
    .tarjeta { max-width: 560px; margin: 0 auto; background: #FFFFFF; border: 1px solid #E4E0D6; border-radius: 12px; overflow: hidden; }
    .cabecera { background: #22605D; padding: 20px 32px; color: #FFFFFF; font-size: 20px; font-weight: bold; letter-spacing: 0.2px; }
    .cuerpo { padding: 32px; }
    .cuerpo h1 { font-family: Georgia, "Times New Roman", serif; font-size: 24px; line-height: 1.25; margin: 0 0 16px; color: #12302F; }
    .cuerpo p { margin: 0 0 16px; }
    .boton { display: inline-block; background: #22605D; color: #FFFFFF !important; text-decoration: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; }
    .nota { font-size: 14px; color: #5C635F; }
    .pie { max-width: 560px; margin: 16px auto 0; font-size: 12px; color: #8A8F8B; text-align: center; }
  </style>
</head>
<body>
  <div class="contenedor">
    <div class="tarjeta">
      <div class="cabecera">Epublit</div>
      <div class="cuerpo">
        {{{ @content }}}
      </div>
    </div>
    <p class="pie">Epublit · Gestión para editoriales independientes</p>
  </div>
</body>
</html>
